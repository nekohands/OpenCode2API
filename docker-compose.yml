services:
  opencode2api:
    build:
      context: .
      dockerfile: Dockerfile
    # Matches the image published by .github/workflows/docker-publish.yml for this fork.
    # Point this back at the upstream namespace if you would rather consume upstream's build.
    image: ghcr.io/nekohands/opencode2api:latest
    container_name: opencode2api
    ports:
      - "${OPENCODE_PROXY_PORT:-10000}:${OPENCODE_PROXY_PORT:-10000}"
    # --- 走 Traefik 反代时改用下面的 labels,并把上面的 ports 删掉 ---
    # 容器接在 Traefik 同一个网络里就不需要发布宿主机端口。
    #
    # 关键:`traefik.http.routers.<名字>.service` 不是可有可无的。只要这个容器定义了
    # **一个以上**的 service(即多写了一条 traefik.http.services.*.loadbalancer.server.port),
    # 没写 .service 的 router 就无法自动链接 —— Traefik 会在日志里记一行
    # "cannot be linked automatically with multiple Services",然后**丢弃整个 router**。
    # 表现是域名返回纯文本 "404 page not found",而容器一直是 Up (healthy),
    # 网络、socket、entrypoint 全都正常,极难排查。
    #
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=traefik"                    # Traefik 自己所在的网络
    #   - "traefik.http.routers.opencode2api.entrypoints=websecure"
    #   - "traefik.http.routers.opencode2api.rule=Host(`opencode.example.com`)"
    #   - "traefik.http.routers.opencode2api.service=opencode2api"
    #   - "traefik.http.routers.opencode2api.tls=true"
    #   - "traefik.http.routers.opencode2api.tls.certresolver=le"
    #   - "traefik.http.services.opencode2api.loadbalancer.server.port=10000"
    #
    # 两点注意:
    # 1) 不要给这个 router 挂 buffering 中间件。Traefik 的 buffering 会等整个响应体
    #    缓冲完才转发,/v1/chat/completions 的流式输出会退化成"等模型全部生成完才返回"。
    # 2) 绝不要把 router 指向容器端口 10001。那是背后的 opencode serve,不是代理:
    #    它能执行 shell、读任意文件,而且只有设了 OPENCODE_SERVER_PASSWORD 才要求认证。
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - BIND_HOST=0.0.0.0
      - DISABLE_TOOLS=${DISABLE_TOOLS:-true}
      - OPENCODE_USE_ISOLATED_HOME=${OPENCODE_USE_ISOLATED_HOME:-false}
      - OPENCODE_PROXY_DEBUG=${OPENCODE_PROXY_DEBUG:-false}
      - OPENCODE_PROXY_PROMPT_MODE=${OPENCODE_PROXY_PROMPT_MODE:-standard}
      - OPENCODE_PROXY_OMIT_SYSTEM_PROMPT=${OPENCODE_PROXY_OMIT_SYSTEM_PROMPT:-false}
      - OPENCODE_PROXY_AUTO_CLEANUP_CONVERSATIONS=${OPENCODE_PROXY_AUTO_CLEANUP_CONVERSATIONS:-false}
      - OPENCODE_PROXY_CLEANUP_INTERVAL_MS=${OPENCODE_PROXY_CLEANUP_INTERVAL_MS:-43200000}
      - OPENCODE_PROXY_CLEANUP_MAX_AGE_MS=${OPENCODE_PROXY_CLEANUP_MAX_AGE_MS:-86400000}
      - OPENCODE_PROXY_REQUEST_TIMEOUT_MS=${OPENCODE_PROXY_REQUEST_TIMEOUT_MS:-180000}
      - OPENCODE_PROXY_PORT=${OPENCODE_PROXY_PORT:-10000}
      - OPENCODE_SERVER_PORT=${OPENCODE_SERVER_PORT:-10001}
    volumes:
      - opencode-data:/home/node/.local/share/opencode
      - opencode-config:/home/node/.config/opencode
    restart: unless-stopped
    healthcheck:
      # Probe /health, not /v1/models. /health is the one operational endpoint that is
      # exempt from the Bearer check, so this works as soon as API_KEY is set; probing
      # /v1/models returns 401 and marks a perfectly healthy container as unhealthy.
      # `curl` is guaranteed present (the Dockerfile installs it); `wget` is not.
      test: ["CMD", "curl", "-f", "http://localhost:${OPENCODE_PROXY_PORT:-10000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  opencode-data:
  opencode-config:

name: Diagnose opencode install

# Temporary workflow. It runs the real `docker build` and republishes the tail of
# the build log as a check-run annotation, because job logs require repository
# admin rights to download while annotations are readable anonymously.
# Delete this file once the build is green.

on:
  push:
    paths:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image and capture the output
        run: |
          set +e
          docker build --progress=plain -t diag-opencode2api . > build.txt 2>&1
          echo "BUILD_EXIT=$?" | tee -a build.txt
          tail -140 build.txt

      - name: Republish the tail of the build log as an annotation
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let t = "";
            try { t = fs.readFileSync("build.txt", "utf8"); } catch (e) { t = "missing build.txt: " + e.message; }
            const tail = t.split("\n").slice(-160).join("\n");
            const body = tail
              .slice(0, 60000)
              .replace(/\r/g, "")
              .replace(/%/g, "%25")
              .replace(/\n/g, "%0A");
            console.log("::warning title=BUILD_TAIL::" + body);
          '
